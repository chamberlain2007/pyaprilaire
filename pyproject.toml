[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaprilaire"
version = "0.9.1"
readme = "README.md"
dependencies = [
    "crc >= 4"
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
cli = ["textual >= 0.60"]
# The mock server only needs the standard library today, but its own
# dependencies belong here rather than in the library's
mock_server = []
dev = ["bumpver", "pip-tools", "pre-commit", "pytest-asyncio", "pytest-cov", "ruff", "textual >= 0.60"]

[project.scripts]
pyaprilaire = "pyaprilaire.cli:main"

[tool.bumpver]
current_version = "0.9.1"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message  = "Bump version {old_version} -> {new_version}"
commit          = true
tag             = true
push            = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
norecursedirs = [
    ".git",
]
log_format = "%(asctime)s.%(msecs)03d %(levelname)-8s %(threadName)s %(name)s:%(filename)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "auto"
filterwarnings = []

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pyaprilaire"]
