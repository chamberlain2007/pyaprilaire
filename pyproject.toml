[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaprilaire"
version = "0.10.0rc1"
description = "A library to interact with AprilAire thermostats"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matthew FitzGerald-Chamberlain" },
]
keywords = ["AprilAire", "thermostat", "home automation", "hvac"]
requires-python = ">=3.14"
dependencies = [
    "crc >= 7.1.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/chamberlain2007/pyaprilaire"
Repository = "https://github.com/chamberlain2007/pyaprilaire"
Author = "https://github.com/chamberlain2007"
Issues = "https://github.com/chamberlain2007/pyaprilaire/issues"

[project.optional-dependencies]
cli = ["textual >= 0.60"]
dev = ["bumpver", "pip-tools", "pre-commit", "pytest-asyncio", "pytest-cov", "ruff", "textual >= 0.60"]

[project.scripts]
pyaprilaire = "pyaprilaire.cli:main"
pyaprilaire-mock-server = "pyaprilaire.mock_server.__main__:main"

[tool.bumpver]
current_version = "0.10.0rc1"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message  = "Bump version {old_version} -> {new_version}"
commit          = true
tag             = true
push            = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
norecursedirs = [
    ".git",
]
log_format = "%(asctime)s.%(msecs)03d %(levelname)-8s %(threadName)s %(name)s:%(filename)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "auto"
filterwarnings = []

[tool.coverage.run]
omit = [
    "pyaprilaire/mock_server/__init__.py",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pyaprilaire"]
